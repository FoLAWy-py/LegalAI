[project]
name = "legalai-retrieval"
version = "0.1.0"
description = "LegalAI retrieval department"
requires-python = ">=3.12"
dependencies = ["legalai-contracts", "numpy>=2.0"]

[project.optional-dependencies]
# Local open-weight embedding models (ADR-0003). Heavy (torch); not needed for tests.
embeddings = ["sentence-transformers>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalai_retrieval"]

[tool.uv.sources]
legalai-contracts = { workspace = true }
